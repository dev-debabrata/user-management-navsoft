<div class="magnifier-container">
  <div
    #imageWrapper
    class="main-image-wrapper"
    (mouseenter)="onMouseEnter()"
    (mouseleave)="onMouseLeave()"
    (mousemove)="onMouseMove($event)"
  >
    <img
      [src]="imageUrl()"
      [alt]="alt()"
      class="main-img"
      (load)="onImageLoaded()"
      (error)="onImageError()"
    />

    @if (isLoading()) {
      <div class="img-loading-overlay">
        <div class="mini-spinner"></div>
      </div>
    }

    @if (hasError()) {
      <div class="img-error-overlay">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="32"
          height="32"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span>Failed to load image</span>
      </div>
    }

    <!-- Hover Lens indicator -->
    @if (isHovering() && !hasError() && !isLoading()) {
      <div
        class="magnifier-lens"
        [style.left.px]="lensPosition().x"
        [style.top.px]="lensPosition().y"
        [style.width.px]="lensSize"
        [style.height.px]="lensSize"
      ></div>
    }
  </div>

  <!-- Zoomed Preview Window -->
  @if (isHovering() && !hasError() && !isLoading()) {
    <div class="zoom-result-window">
      <div
        class="zoom-result-image"
        [style.background-image]="'url(' + imageUrl() + ')'"
        [style.background-position]="bgPosition()"
        [style.background-size]="zoomLevel() * 100 + '%'"
      ></div>
      <div class="zoom-badge">
        <span>{{ zoomLevel() }}x Zoom</span>
      </div>
    </div>
  }
</div>
