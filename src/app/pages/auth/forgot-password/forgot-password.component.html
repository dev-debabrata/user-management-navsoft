<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-brand">
        <div class="brand-badge">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="28"
            height="28"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
          </svg>
        </div>
        <h2>UserManage</h2>
      </div>
      <h1 class="auth-title">Forgot Password?</h1>
      <p class="auth-subtitle">
        Enter your registered email and we'll check your account to reset your password
      </p>
    </div>

    @if (errorMessage()) {
      <div class="alert alert-error">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span>{{ errorMessage() }}</span>
      </div>
    }

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label for="email">Registered Email</label>
        <div class="input-wrapper">
          <svg
            class="input-icon"
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"
            ></path>
            <polyline points="22,6 12,13 2,6"></polyline>
          </svg>
          <input
            id="email"
            type="email"
            formControlName="email"
            placeholder="name@example.com"
            class="form-control"
            [class.is-invalid]="isFieldInvalid('email')"
          />
        </div>
        @if (isFieldInvalid('email')) {
          <div class="error-msg">Please enter a valid registered email address.</div>
        }
      </div>

      <div class="form-action">
        <app-ui-button
          type="submit"
          variant="primary"
          size="lg"
          [fullWidth]="true"
          [loading]="isLoading()"
        >
          Verify & Continue
        </app-ui-button>
      </div>
    </form>

    <div class="auth-footer">
      <p>Remembered your password? <a routerLink="/login">Back to Sign in</a></p>
    </div>
  </div>
</div>
